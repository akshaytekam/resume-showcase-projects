bundle:
  name: lakeflow_sales_pipeline

include:
  - resources/*.yml

variables:

  catalog:
    description: Unity Catalog catalog
    default: de_demo

  schema:
    description: Unity Catalog schema
    default: lakeflow_sales

  volume:
    description: Raw data volume
    default: raw

targets:

  dev:
    mode: development
    default: true

    variables:
      catalog: de_demo
      schema: lakeflow_sales
      volume: raw

  test:
    variables:
      catalog: de_demo
      schema: lakeflow_sales
      volume: raw

  prod:
    mode: production

    variables:
      catalog: de_demo
      schema: lakeflow_sales
      volume: raw
